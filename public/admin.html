<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>然后呢？调研数据导出</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><div class="eyebrow">然后呢？研究后台</div><section class="card"><h1>下载调研数据</h1><p>这里可以导出问卷答案和浏览行为。数据保存在服务器的 <code>data/responses.jsonl</code> 文件中。</p><p class="muted">启动服务器时需要设置 ADMIN_TOKEN。密码只供研究人员使用，不要发给参与者。</p><label>管理员密码<input type="password" id="token" autocomplete="current-password" placeholder="输入启动服务器时设置的 ADMIN_TOKEN"></label><div class="actions"><button class="btn primary" id="csv">下载 CSV（Excel）</button><button class="btn" id="json">下载原始 JSONL</button></div><p id="status" class="muted"></p><h2>数据包含什么？</h2><ul><li>匿名参与者编号与随机帖子分配</li><li>每篇问卷与最终问卷答案</li><li>“然后呢”点击或未点击行为</li><li>点击前停留时长</li><li>页面滚动深度和切换前后台事件</li><li>视口大小、浏览器信息和事件时间</li></ul><p class="muted">当前 CSV 每行是一条事件或答卷，answers 列保存该次问卷答案。正式研究前请另外备份测试数据，避免与正式答卷混用。</p><p><a href="/">返回问卷</a></p></section></main><script>async function download(format){const token=document.querySelector('#token').value;const status=document.querySelector('#status');if(!token){status.textContent='请输入管理员密码';return;}status.textContent='正在导出…';try{const response=await fetch('/api/export?token='+encodeURIComponent(token)+'&format='+format);if(!response.ok)throw new Error('导出失败：请确认密码正确，且服务器已设置 ADMIN_TOKEN。');const blob=await response.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='then-next-survey.'+(format==='csv'?'csv':'jsonl');a.click();URL.revokeObjectURL(url);status.textContent='已生成下载文件。';}catch(e){status.textContent=e.message;}}document.querySelector('#csv').onclick=()=>download('csv');document.querySelector('#json').onclick=()=>download('jsonl');</script></body></html>
